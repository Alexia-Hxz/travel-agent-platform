server {
    listen 80;
    server_name _;

    # Match the frontend's 10 MiB upload validation and leave room for multipart overhead.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Planning runs several search and model calls, so a single request can take
        # minutes on a cold start. A short read timeout turns that into a 504, which
        # the browser reports as "cannot generate a plan". Keep generous headroom.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /static/ {
        # Bundled place placeholders are served by the backend, so the container
        # deployment needs the same proxy rule the dev server gets for free.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
