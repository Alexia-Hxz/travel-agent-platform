[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "Backend for the multimodal travel planning platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2,<1.0",
  "openai>=1.0,<2.0",
  "python-multipart>=0.0.32",
  "pypdf>=5.0,<6.0",
  "paddleocr==2.9.1",
  "paddlepaddle==2.6.2",
  "posthog>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "setuptools>=65",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
